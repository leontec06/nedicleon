document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ra:   #C07A45;   /* muted orange */\n    --terra-soft:#EBCFB0; /* warm peach-tan */\n    --blue:    #6E91A4;   /* muted dusty blue */\n    --blue-soft:#CDDCE2;\n    --sand:    #E9D9BF;\n    --tan:     #E2D0B6;\n    --line:    #E7DAC4;\n\n    --display: 'Chango', 'Fredoka', system-ui, sans-serif;\n    --body:    'Hanken Grotesk', system-ui, sans-serif;\n\n    --maxw: 1240px;\n  }\n\n  * { box-sizing: border-box; }\n\n  html { scroll-behavior: smooth; }\n\n  body {\n    margin: 0;\n    background: var(--cream);\n    color: var(--ink);\n    font-family: var(--body);\n    font-size: 17px;\n    line-height: 1.65;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  a { color: inherit; }\n\n  ::selection { background: var(--sand); color: var(--ink); }\n\n  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }\n\n  .glyph { color: var(--ink-soft); font-weight: 400; }\n\n  /* ---------- NAV ---------- */\n  header.nav {\n    position: sticky;\n    top: 0;\n    z-index: 50;\n    backdrop-filter: blur(10px);\n    background: rgba(251, 247, 242, 0.78);\n    border-bottom: 1px solid var(--line);\n  }\n  .nav-inner {\n    max-width: var(--maxw);\n    margin: 0 auto;\n    padding: 16px 28px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 20px;\n  }\n  .brand {\n    font-family: var(--display);\n    font-size: 18px;\n    text-transform: uppercase;\n    letter-spacing: 0.01em;\n    color: var(--ink);\n    text-decoration: none;\n    line-height: 1;\n    white-space: nowrap;\n  }\n  .brand .star { color: var(--ink-soft); font-weight: 400; margin-left: 4px; }\n  nav.links {\n    display: flex;\n    gap: 30px;\n    align-items: center;\n  }\n  nav.links a {\n    text-decoration: none;\n    font-size: 15px;\n    letter-spacing: 0.01em;\n    color: var(--ink);\n    padding: 4px 0;\n    position: relative;\n    transition: color .2s ease;\n  }\n  nav.links a::after {\n    content: \"\";\n    position: absolute;\n    left: 0; right: 100%;\n    bottom: -2px;\n    height: 1.5px;\n    background: var(--ink);\n    transition: right .25s ease;\n  }\n  nav.links a:hover { color: var(--ink); }\n  nav.links a:hover::after { right: 0; }\n\n  /* ---------- HERO ---------- */\n  .hero {\n    text-align: center;\n    padding: clamp(70px, 13vw, 150px) 0 clamp(48px, 8vw, 90px);\n    position: relative;\n    overflow: hidden;\n  }\n  .hero .kicker {\n    font-size: 14px;\n    letter-spacing: 0.42em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    margin: 0 0 22px;\n  }\n  .hero h1 {\n    font-family: var(--display);\n    text-transform: uppercase;\n    font-size: clamp(46px, 11.5vw, 138px);\n    line-height: 0.9;\n    letter-spacing: -0.005em;\n    margin: 0;\n    color: var(--ink);\n  }\n  .hero .sub {\n    margin: 28px auto 0;\n    max-width: 460px;\n    color: var(--ink-soft);\n    font-size: 16px;\n  }\n  .hero .deco {\n    position: absolute;\n    font-size: clamp(22px, 3vw, 34px);\n    color: var(--ink-soft);\n    opacity: .55;\n    user-select: none;\n    pointer-events: none;\n  }\n  .hero .deco.d1 { top: 16%;  left: 12%; }\n  .hero .deco.d2 { top: 30%;  right: 13%; }\n  .hero .deco.d3 { bottom: 24%; left: 18%; }\n  .hero .deco.d4 { bottom: 30%; right: 16%; }\n  @media (max-width: 640px){ .hero .deco { display:none; } }\n\n  /* ---------- MARQUEE ---------- */\n  .marquee {\n    background: var(--terra-soft);\n    border-top: 1px solid rgba(74,66,59,.08);\n    border-bottom: 1px solid rgba(74,66,59,.08);\n    overflow: hidden;\n    padding: 15px 0;\n    white-space: nowrap;\n    user-select: none;\n  }\n  .marquee-track {\n    display: inline-flex;\n    align-items: center;\n    will-change: transform;\n    animation: scroll-x 38s linear infinite;\n  }\n  .marquee:hover .marquee-track { animation-play-state: paused; }\n  .marquee span {\n    font-family: var(--display);\n    font-weight: 500;\n    font-size: 17px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--ink);\n    padding: 0 4px;\n  }\n  .marquee .g { color: rgba(74,66,59,.5); padding: 0 22px; }\n  @keyframes scroll-x {\n    from { transform: translateX(0); }\n    to   { transform: translateX(-50%); }\n  }\n  @media (prefers-reduced-motion: reduce){\n    .marquee-track { animation: none; }\n  }\n\n  /* ---------- SECTION SHELL ---------- */\n  section { scroll-margin-top: 78px; }\n  .section-pad { padding: clamp(64px, 10vw, 120px) 0; }\n  .eyebrow {\n    font-size: 13px;\n    letter-spacing: 0.34em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    margin: 0 0 14px;\n  }\n  .h2 {\n    font-family: var(--display);\n    text-transform: uppercase;\n    font-size: clamp(30px, 5vw, 54px);\n    line-height: 1;\n    letter-spacing: 0;\n    margin: 0;\n  }\n  .h2 .glyph { font-size: 0.55em; margin-left: 12px; vertical-align: 0.12em; }\n\n  /* ---------- ABOUT ---------- */\n  .about-grid {\n    display: grid;\n    grid-template-columns: 1.05fr 0.95fr;\n    gap: clamp(36px, 6vw, 80px);\n    align-items: center;\n  }\n  .about-copy p {\n    font-size: clamp(17px, 1.5vw, 20px);\n    line-height: 1.72;\n    color: var(--ink);\n    max-width: 56ch;\n    margin: 26px 0 0;\n    text-wrap: pretty;\n  }\n  .about-copy p:first-of-type { margin-top: 26px; }\n  .portrait {\n    aspect-ratio: 4 / 5;\n    border-radius: 8px;\n    overflow: hidden;\n    background: var(--tan);\n  }\n  .portrait img { width: 100%; height: 100%; object-fit: cover; display:block; }\n  @media (max-width: 760px){\n    .about-grid { grid-template-columns: 1fr; }\n    .portrait { max-width: 360px; }\n  }\n\n  /* ---------- GALLERY ---------- */\n  .gallery-head {\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n    gap: 20px;\n    margin-bottom: 36px;\n    flex-wrap: wrap;\n  }\n  .gallery-head .note { color: var(--ink-soft); font-size: 14.5px; }\n  .masonry {\n    column-count: 3;\n    column-gap: 18px;\n  }\n  @media (max-width: 980px){ .masonry { column-count: 2; } }\n  @media (max-width: 560px){ .masonry { column-count: 1; } }\n  .masonry figure {\n    break-inside: avoid;\n    margin: 0 0 18px;\n    border-radius: 7px;\n    overflow: hidden;\n    cursor: zoom-in;\n    background: var(--cream-2);\n    position: relative;\n    line-height: 0;\n    transform: translateZ(0);\n    transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease;\n  }\n  .masonry figure img {\n    width: 100%;\n    height: auto;\n    display: block;\n  }\n  .masonry figure:hover {\n    transform: translateY(-3px);\n    box-shadow: 0 18px 34px -18px rgba(74,66,59,.4);\n  }\n  .masonry figure::after {\n    content: \"✧\";\n    position: absolute;\n    top: 12px; right: 14px;\n    color: #fff;\n    font-size: 15px;\n    opacity: 0;\n    text-shadow: 0 1px 6px rgba(0,0,0,.4);\n    transition: opacity .3s ease;\n  }\n  .masonry figure:hover::after { opacity: .9; }\n\n  /* ---------- LIGHTBOX ---------- */\n  .lb {\n    position: fixed;\n    inset: 0;\n    z-index: 100;\n    background: rgba(40, 35, 30, 0.82);\n    backdrop-filter: blur(6px);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 4vw;\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity .3s ease, visibility .3s;\n  }\n  .lb.open { opacity: 1; visibility: visible; }\n  .lb img {\n    max-width: 100%;\n    max-height: 90vh;\n    border-radius: 6px;\n    box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);\n    transform: scale(.97);\n    transition: transform .3s cubic-bezier(.2,.7,.2,1);\n  }\n  .lb.open img { transform: scale(1); }\n  .lb-btn {\n    position: absolute;\n    background: rgba(251,247,242,.92);\n    color: var(--ink);\n    border: none;\n    width: 48px; height: 48px;\n    border-radius: 50%;\n    font-size: 20px;\n    cursor: pointer;\n    display: flex; align-items: center; justify-content: center;\n    font-family: var(--body);\n    transition: background .2s ease, transform .2s ease;\n  }\n  .lb-btn:hover { background: #fff; transform: scale(1.06); }\n  .lb-close { top: 20px; right: 20px; font-size: 22px; }\n  .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }\n  .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }\n  .lb-prev:hover, .lb-next:hover { transform: translateY(-50%) scale(1.06); }\n  .lb-count {\n    position: absolute;\n    bottom: 22px; left: 50%; transform: translateX(-50%);\n    color: rgba(255,255,255,.85);\n    font-size: 13px;\n    letter-spacing: .12em;\n  }\n  @media (max-width: 600px){ .lb-prev, .lb-next { display: none; } }\n\n  /* ---------- CONTACT ---------- */\n  #contact { background: var(--blue-soft); border-top: 1px solid rgba(74,66,59,.07); }\n  .contact-inner { text-align: center; }\n  .contact-inner .h2 { margin-bottom: 14px; }\n  .contact-lead {\n    color: var(--ink-soft);\n    max-width: 460px;\n    margin: 0 auto 44px;\n    font-size: 16px;\n  }\n  .contact-links {\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n    align-items: center;\n  }\n  .contact-links a {\n    font-family: var(--body);\n    font-weight: 600;\n    font-size: clamp(20px, 3.6vw, 34px);\n    text-decoration: none;\n    color: var(--ink);\n    line-height: 1.18;\n    position: relative;\n    transition: opacity .2s ease;\n  }\n  .contact-links a span.tiny {\n    font-family: var(--body);\n    font-size: 14px;\n    letter-spacing: .26em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    display: block;\n    margin-bottom: 2px;\n    font-weight: 500;\n  }\n  .contact-links a .word { background-image: linear-gradient(var(--ink),var(--ink)); background-size: 0% 1.5px; background-position: 0 100%; background-repeat: no-repeat; transition: background-size .3s ease; padding-bottom: 3px; }\n  .contact-links a:hover .word { background-size: 100% 1.5px; }\n  .contact-pair { margin: 0 0 30px; }\n\n  /* ---------- ABOUT META (CV blocks) ---------- */\n  .about-meta {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: clamp(24px, 4vw, 52px);\n    margin-top: clamp(48px, 7vw, 88px);\n  }\n  .meta-block { border-top: 1.5px solid var(--line); padding-top: 18px; }\n  .meta-label {\n    font-family: var(--display);\n    text-transform: uppercase;\n    font-size: 14px;\n    letter-spacing: 0.03em;\n    color: var(--terra);\n    margin: 0 0 14px;\n  }\n  .meta-item {\n    font-size: 15.5px;\n    line-height: 1.5;\n    color: var(--ink);\n    margin: 0 0 11px;\n    max-width: 34ch;\n    text-wrap: pretty;\n  }\n  .meta-item:last-child { margin-bottom: 0; }\n  @media (max-width: 760px){\n    .about-meta { grid-template-columns: 1fr; gap: 0; }\n    .meta-block { margin-top: 26px; }\n  }\n\n  /* ---------- QUOTE ---------- */\n  .quote-band { background: var(--cream); padding: 44px 0 10px; }\n  .quote {\n    max-width: 430px;\n    font-size: 13.5px;\n    line-height: 1.6;\n    font-style: italic;\n    color: var(--ink-soft);\n    margin: 0;\n  }\n  .quote .src {\n    display: block;\n    font-style: normal;\n    letter-spacing: 0.04em;\n    margin-top: 6px;\n    font-size: 12.5px;\n    opacity: .85;\n  }\n\n  /* ---------- FOOTER ---------- */\n  footer.foot {\n    background: var(--blue-soft);\n    text-align: center;\n    padding: 14px 0 40px;\n    color: var(--ink-soft);\n    font-size: 13px;\n    letter-spacing: .04em;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  \n\n  <header class=\"nav\">\n    <div class=\"nav-inner\">\n      <a href=\"#top\" class=\"brand\">Léon Nedic<span class=\"star\">✧<\u002Fspan><\u002Fa>\n      <nav class=\"links\">\n        <a href=\"#about\">About<\u002Fa>\n        <a href=\"#gallery\">Gallery<\u002Fa>\n        <a href=\"#contact\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main id=\"top\">\n\n    <!-- HERO -->\n    <section class=\"hero\">\n      <span class=\"deco d1\">⭒<\u002Fspan>\n      <span class=\"deco d2\">⋆<\u002Fspan>\n      <span class=\"deco d3\">⏾<\u002Fspan>\n      <span class=\"deco d4\">₊˚<\u002Fspan>\n      <div class=\"wrap\">\n        <p class=\"kicker\">Photography<\u002Fp>\n        <h1>Léon&nbsp;Nedic<\u002Fh1>\n        <p class=\"sub\">Frames from everyday life — light, places, and small moments, caught on film &amp; digital. Based in Switzerland.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- MARQUEE -->\n    <div class=\"marquee\" aria-hidden=\"true\">\n      <div class=\"marquee-track\" id=\"marquee\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ABOUT -->\n    <section id=\"about\" class=\"section-pad\">\n      <div class=\"wrap\">\n        <div class=\"about-grid\">\n          <div class=\"about-copy\">\n            <p class=\"eyebrow\">About<\u002Fp>\n            <h2 class=\"h2\">Hello <span class=\"glyph\">⋆<\u002Fspan><\u002Fh2>\n            <p>I am 19 years old and I live in Switzerland. I study computer science at ETH Zurich because I have been fascinated by technology, particularly IT, since childhood.<\u002Fp>\n            <p>In my spare time, I enjoy working out, playing tennis, playing the saxophone, and taking pictures and recording videos. I also have a rather strong affection for coffee&nbsp;:).<\u002Fp>\n            <p>I hope you enjoy exploring my website. Feel free to get in touch with me anytime.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"portrait\" id=\"portrait\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"about-meta\">\n          <div class=\"meta-block\">\n            <p class=\"meta-label\">Occupation<\u002Fp>\n            <p class=\"meta-item\">Computer Science Student at ETH Zurich<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"meta-block\">\n            <p class=\"meta-label\">Voluntary Work<\u002Fp>\n            <p class=\"meta-item\">Photographer / Content Creator at Campuslabel Krummenau<\u002Fp>\n            <p class=\"meta-item\">IT Support, Canoe Club Rapperswil-Jona<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"meta-block\">\n            <p class=\"meta-label\">Awards<\u002Fp>\n            <p class=\"meta-item\">Lions Club Rapperswil Youth Promotion Award for the best Matura at Wattwil Cantonal School, 2024<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- GALLERY -->\n    <section id=\"gallery\" class=\"section-pad\" style=\"padding-top:0;\">\n      <div class=\"wrap\">\n        <div class=\"gallery-head\">\n          <div>\n            <p class=\"eyebrow\">Gallery<\u002Fp>\n            <h2 class=\"h2\">Selected work <span class=\"glyph\">✧<\u002Fspan><\u002Fh2>\n          <\u002Fdiv>\n          <p class=\"note\">Click any frame to view ⭒<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"masonry\" id=\"masonry\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- CONTACT -->\n    <section id=\"contact\" class=\"section-pad\">\n      <div class=\"wrap contact-inner\">\n        <p class=\"eyebrow\">Contact<\u002Fp>\n        <h2 class=\"h2\">Get in touch <span class=\"glyph\">₊˚<\u002Fspan><\u002Fh2>\n        <p class=\"contact-lead\">Available for collaborations, prints, and a good cup of coffee. I'd love to hear from you.<\u002Fp>\n        <div class=\"contact-links\">\n          <div class=\"contact-pair\">\n            <a href=\"mailto:email@nedicleon.ch\">\n              <span class=\"tiny\">Email<\u002Fspan>\n              <span class=\"word\">email@nedicleon.ch<\u002Fspan>\n            <\u002Fa>\n          <\u002Fdiv>\n          <div class=\"contact-pair\">\n            <a href=\"https://instagram.com/leons.photographs\" target=\"_blank\" rel=\"noopener\">\n              <span class=\"tiny\">Instagram<\u002Fspan>\n              <span class=\"word\">@leons.photographs<\u002Fspan>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <div class=\"quote-band\">\n    <div class=\"wrap\">\n      <p class=\"quote\">“You don't have to see the whole staircase, just take the first step.”<span class=\"src\">— Martin Luther King Jr.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer class=\"foot\">\n    <div class=\"wrap\">© <span id=\"yr\"><\u002Fspan> Léon Nedic &nbsp;⭒&nbsp; Made with care in Switzerland<\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- LIGHTBOX -->\n  <div class=\"lb\" id=\"lb\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Image viewer\">\n    <button class=\"lb-btn lb-close\" id=\"lbClose\" aria-label=\"Close\">✕<\u002Fbutton>\n    <button class=\"lb-btn lb-prev\" id=\"lbPrev\" aria-label=\"Previous\">‹<\u002Fbutton>\n    <button class=\"lb-btn lb-next\" id=\"lbNext\" aria-label=\"Next\">›<\u002Fbutton>\n    <img id=\"lbImg\" alt=\"\">\n    <div class=\"lb-count\" id=\"lbCount\"><\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n/* =====================================================================\n   PHOTOS — to add your own pictures, just put files in an /images\n   folder and add entries to this list. Replace `src: placeholder(...)`\n   with e.g.  src: \"images/my-photo.jpg\".  Order top→bottom = grid order.\n   The grid keeps every aspect ratio (no cropping); the lightbox shows\n   the full image. Mix portrait & landscape freely.\n   ===================================================================== */\n\n// --- soft striped placeholder generator (delete once real photos are in) ---\nconst TONES = ['#E2D0B6', '#EBCFB0', '#CDDCE2', '#D8C3A6'];\nfunction placeholder(w, h, i){\n  const tone = TONES[i % TONES.length];\n  const ratio = (w/h).toFixed(2);\n  const svg =\n   `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>\n      <defs>\n        <pattern id='p' width='22' height='22' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'>\n          <rect width='22' height='22' fill='${tone}'/>\n          <line x1='0' y1='0' x2='0' y2='22' stroke='rgba(74,66,59,.05)' stroke-width='11'/>\n        <\u002Fpattern>\n      <\u002Fdefs>\n      <rect width='100%' height='100%' fill='${tone}'/>\n      <rect width='100%' height='100%' fill='url(%23p)'/>\n      <text x='50%' y='50%' fill='rgba(74,66,59,.5)' font-family='monospace' font-size='${Math.round(Math.min(w,h)/14)}' text-anchor='middle' dominant-baseline='middle'>photo ${String(i+1).padStart(2,'0')} \\u00b7 ${ratio}:1<\u002Ftext>\n    <\u002Fsvg>`;\n  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg.replace(/\\n\\s*/g,''));\n}\n\n// mixed aspect ratios for a natural editorial rhythm (w, h are just proportions)\nconst RATIOS = [\n  [1200,1600],[1600,1067],[1067,1600],[1600,1200],\n  [1600,1066],[1200,1500],[1500,1000],[1080,1080],\n  [1600,1040],[1100,1500],[1600,1200],[1000,1500]\n];\n\nconst photos = RATIOS.map((r, i) => ({\n  src: placeholder(r[0], r[1], i),   // ← replace with \"images/your-file.jpg\"\n  alt: 'Photograph ' + (i+1)\n}));\n\n/* ---------------- render gallery ---------------- */\nconst masonry = document.getElementById('masonry');\nphotos.forEach((p, i) => {\n  const fig = document.createElement('figure');\n  const img = document.createElement('img');\n  img.src = p.src;\n  img.alt = p.alt;\n  img.loading = 'lazy';\n  img.dataset.index = i;\n  fig.appendChild(img);\n  fig.addEventListener('click', () => openLB(i));\n  masonry.appendChild(fig);\n});\n\n// portrait placeholder for the About section\ndocument.getElementById('portrait').style.backgroundImage =\n  `url(\"${placeholder(800,1000,1).replace(/\"/g,'\\\\\"')}\")`;\ndocument.getElementById('portrait').style.backgroundSize = 'cover';\ndocument.getElementById('portrait').style.backgroundPosition = 'center';\n\n/* ---------------- marquee ---------------- */\nconst mq = document.getElementById('marquee');\nconst bits = ['ETH Student','Life Enjoyer','Photographer'];\nconst glyphs = ['⭒','⋆','⏾','✧','₊˚'];\nlet unit = '';\nconst seq = bits.concat(bits, bits); // repeat so the track is wide enough to loop seamlessly\nseq.forEach((b,i)=>{ unit += `<span>${b}<\u002Fspan><span class=\"g\">${glyphs[i%glyphs.length]}<\u002Fspan>`; });\nmq.innerHTML = unit + unit; // duplicate for seamless 50% loop\n\n/* ---------------- lightbox ---------------- */\nconst lb = document.getElementById('lb');\nconst lbImg = document.getElementById('lbImg');\nconst lbCount = document.getElementById('lbCount');\nlet cur = 0;\n\nfunction openLB(i){\n  cur = i;\n  showLB();\n  lb.classList.add('open');\n  document.body.style.overflow = 'hidden';\n}\nfunction showLB(){\n  lbImg.src = photos[cur].src;\n  lbImg.alt = photos[cur].alt;\n  lbCount.textContent = (cur+1) + ' / ' + photos.length;\n}\nfunction closeLB(){\n  lb.classList.remove('open');\n  document.body.style.overflow = '';\n}\nfunction step(d){\n  cur = (cur + d + photos.length) % photos.length;\n  showLB();\n}\ndocument.getElementById('lbClose').addEventListener('click', closeLB);\ndocument.getElementById('lbPrev').addEventListener('click', e=>{e.stopPropagation(); step(-1);});\ndocument.getElementById('lbNext').addEventListener('click', e=>{e.stopPropagation(); step(1);});\nlb.addEventListener('click', e => { if(e.target === lb || e.target === lbImg) closeLB(); });\ndocument.addEventListener('keydown', e => {\n  if(!lb.classList.contains('open')) return;\n  if(e.key === 'Escape') closeLB();\n  if(e.key === 'ArrowLeft') step(-1);\n  if(e.key === 'ArrowRight') step(1);\n});\n\ndocument.getElementById('yr').textContent = new Date().getFullYear();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
